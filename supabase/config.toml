# Minimal Supabase CLI config — run `supabase init` if you prefer the full default file.
project_id = "wissnails-studio"

[api]
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
